<fieldset class="cms-password" data-password-mode>
  <legend>{{ form.password_mode.label }}</legend>
  {% for choice in form.password_mode %}<label class="cms-radio">{{ choice.tag }} <span>{{ choice.choice_label }}</span></label>{% endfor %}
  <div class="cms-manual-password" data-manual-password>
    {% include "ledger/users/_field.html" with field=form.password1 %}
    {% include "ledger/users/_field.html" with field=form.password2 %}
    <small class="cms-hint">Minimal 10 karakter, tidak terlalu umum, dan tidak mirip dengan nama pengguna.</small>
  </div>
</fieldset>
