{# Renders one form field with label, help text and errors. #}
<div class="cms-field{% if field.errors %} has-error{% endif %}{% if wide %} wide{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="cms-check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="cms-error">{{ error }}</small>{% endfor %}
</div>
